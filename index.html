<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>City Sandbox</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #ecdcb8; }
      canvas { display: block; }
      #crosshair {
        display: none; position: fixed; left: 50%; top: 50%; width: 6px; height: 6px;
        margin: -4px 0 0 -4px; border: 1px solid rgba(20, 15, 10, 0.7); border-radius: 50%;
        background: rgba(255, 244, 220, 0.9); pointer-events: none;
      }
      #hurt {
        position: fixed; inset: 0; opacity: 0; pointer-events: none;
        background: radial-gradient(ellipse at center, transparent 45%, rgba(190, 30, 20, 0.6));
      }
      #prompt {
        display: none; position: fixed; left: 50%; bottom: 70px; transform: translateX(-50%);
        font: 15px system-ui, sans-serif; color: #f3e9d2; background: rgba(40, 30, 20, 0.7);
        padding: 8px 14px; border-radius: 6px; pointer-events: none;
      }
      #speed {
        display: none; position: fixed; right: 18px; bottom: 60px;
        font: bold 26px system-ui, sans-serif; color: #f3e9d2; background: rgba(40, 30, 20, 0.6);
        padding: 6px 14px; border-radius: 8px; pointer-events: none;
      }
      #hint {
        position: fixed; left: 12px; bottom: 12px;
        font: 13px system-ui, sans-serif; color: #f3e9d2;
        background: rgba(40, 30, 20, 0.55); padding: 6px 10px; border-radius: 6px;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <div id="hurt"></div>
    <div id="crosshair"></div>
    <div id="speed"></div>
    <div id="prompt">Press E to open or close the fridge</div>
    <div id="hint">Click the game, then: WASD to walk · Mouse to look · Shift to run · Space to jump · Hold C to crouch · Q: gun · Right mouse: aim · Left mouse: shoot · F: get in/out of the truck or a boat (WASD drive, Space brake) · Esc to free the mouse</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
